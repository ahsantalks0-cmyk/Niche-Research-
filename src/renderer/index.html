<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'" />
  <title>Niche Research Department</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/shell.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <div id="theme-veil"></div>

  <div id="app">
    <!-- ═══════════════ custom premium title bar (frameless) ═══════════════ -->
    <header class="titlebar" id="titlebar">
      <div class="tb-brand">
        <img src="../../assets/icons/icon-32x32.png" alt="NRD" draggable="false" />
        <div class="tb-name">Niche <span>Research</span> Department</div>
      </div>
      <div class="tb-sub">Agentic Intelligence</div>
      <div class="tb-drag"></div>
      <div class="tb-controls">
        <button id="win-min" title="Minimize" aria-label="Minimize">
          <svg viewBox="0 0 12 12" width="12" height="12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
        <button id="win-max" title="Maximize" aria-label="Maximize">
          <svg id="ic-max-svg" viewBox="0 0 12 12" width="12" height="12"><rect x="1.8" y="1.8" width="8.4" height="8.4" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <button id="win-close" class="tb-close" title="Close" aria-label="Close">
          <svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <!-- ═══════════════════════════ sidebar ═══════════════════════════ -->
    <aside class="sidebar" id="sidebar">
      <div class="side-search">
        <input id="global-search" type="text" placeholder="Global search…" aria-label="Global search" />
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
        <span class="kbd">⌘K</span>
      </div>

      <nav class="nav" id="nav" aria-label="Main navigation">
        <div class="nav-label">Workspace</div>
        <button class="nav-item active" data-page="dashboard" title="Dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="9" rx="2"/><rect x="13.5" y="3" width="7.5" height="5.5" rx="2"/><rect x="13.5" y="12.5" width="7.5" height="8.5" rx="2"/><rect x="3" y="16" width="7.5" height="5" rx="2"/></svg>
          <span class="nav-text">Dashboard</span>
        </button>
        <button class="nav-item" data-page="research" title="New Research">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8.5 11h5M11 8.5v5"/></svg>
          <span class="nav-text">New Research</span>
        </button>
        <button class="nav-item" data-page="niches" title="Niches">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 7.7l5.4-.8z"/></svg>
          <span class="nav-text">Niches</span>
        </button>
        <button class="nav-item" data-page="reports" title="Reports">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8.5L19 7v14a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 21V4a1.5 1.5 0 0 1 1-1.5z"/><path d="M14 2.5V7h4.5M8.5 12.5h7M8.5 16h7"/></svg>
          <span class="nav-text">Reports</span>
        </button>

        <div class="nav-label">Intelligence</div>
        <button class="nav-item" data-page="consultant" title="Consultant Chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3 8.9 8.9 0 0 1-3.2-.6L3 20.5l1.4-5a8 8 0 0 1-1-3.9A8.4 8.4 0 0 1 11.9 3.2 8.4 8.4 0 0 1 21 11.5z"/></svg>
          <span class="nav-text">Consultant Chat</span>
          <span class="nav-badge">SOON</span>
        </button>
        <button class="nav-item" data-page="settings" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.82-2.83l.06-.06a1.7 1.7 0 0 0 .33-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 8.9a1.7 1.7 0 0 0-.33-1.88l-.06-.06a2 2 0 1 1 2.82-2.82l.06.06a1.7 1.7 0 0 0 1.87.33h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.33l.06-.06a2 2 0 1 1 2.83 2.82l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
          <span class="nav-text">Settings</span>
        </button>
      </nav>

      <div class="side-profile" id="side-profile" title="Research Director">
        <div class="avatar">RD</div>
        <div class="sp-meta">
          <div class="sp-name">Research Director</div>
          <div class="sp-role">Full department access</div>
        </div>
        <svg class="sp-chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 10l4 4 4-4"/></svg>
      </div>

      <button class="side-collapse" id="btn-collapse" title="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        <span class="nav-text">Collapse</span>
      </button>
    </aside>

    <!-- ═══════════════════════════ main content ═══════════════════════════ -->
    <main id="main">
      <div class="topbar">
        <h1 id="page-title">Dashboard</h1>
        <div class="topbar-actions">
          <button class="icon-btn" id="btn-updates" title="Updates" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
            <span class="dot"></span>
          </button>
          <button class="icon-btn tt" data-tip="Notifications" id="btn-bell">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="dot" id="bell-dot" style="display:none"></span>
          </button>
          <button class="icon-btn tt" data-tip="Settings" data-goto="settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.82-2.83l.06-.06a1.7 1.7 0 0 0 .33-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 8.9a1.7 1.7 0 0 0-.33-1.88l-.06-.06a2 2 0 1 1 2.82-2.82l.06.06a1.7 1.7 0 0 0 1.87.33h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.33l.06-.06a2 2 0 1 1 2.83 2.82l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
          </button>
        </div>
      </div>

      <!-- page sections are injected here by the SPA router -->
      <div id="pages"></div>
    </main>
  </div>

  <!-- update banner / toast stack / modal are injected by JS -->

  <script src="vendor/chart.umd.js"></script>
  <script src="js/dev-stub.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/updater-ui.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/research.js"></script>
  <script src="js/pages/niches.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/pages/consultant.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

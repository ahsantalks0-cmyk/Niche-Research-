<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'" />
  <title>Niche Research Department</title>
  <link rel="stylesheet" href="styles/atelier.css" />
  <link rel="stylesheet" href="styles/frame.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <div class="stage" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div id="theme-veil"></div>

  <div id="app">
    <!-- ═══════════════ premium sidebar ═══════════════ -->
    <aside class="sidebar">
      <div class="sb-brand">
        <img src="../../assets/icons/icon-64x64.png" alt="NRD" draggable="false" />
        <div>
          <div class="sb-name">Niche <em>Research</em><br/>Department</div>
          <div class="sb-tag">Atelier · v3</div>
        </div>
      </div>

      <nav class="nav" aria-label="Primary">
        <div class="nav-label">Workspace</div>
        <button class="nav-item active" data-page="dashboard" title="Dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="9" rx="2"/><rect x="13.5" y="3" width="7.5" height="5.5" rx="2"/><rect x="13.5" y="12.5" width="7.5" height="8.5" rx="2"/><rect x="3" y="16" width="7.5" height="5" rx="2"/></svg>
          <span>Studio</span>
        </button>
        <button class="nav-item" data-page="research" title="New Research">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8.5 11h5M11 8.5v5"/></svg>
          <span>New Research</span>
        </button>
        <button class="nav-item" data-page="niches" title="Niches">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 7.7l5.4-.8z"/></svg>
          <span>Niches</span>
        </button>
        <button class="nav-item" data-page="reports" title="Reports">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8.5L19 7v14a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 21V4a1.5 1.5 0 0 1 1-1.5z"/><path d="M14 2.5V7h4.5M8.5 12.5h7M8.5 16h7"/></svg>
          <span>Reports</span>
        </button>

        <div class="nav-label">Intelligence</div>
        <button class="nav-item" data-page="consultant" title="Consultant Chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3 8.9 8.9 0 0 1-3.2-.6L3 20.5l1.4-5a8 8 0 0 1-1-3.9A8.4 8.4 0 0 1 11.9 3.2 8.4 8.4 0 0 1 21 11.5z"/></svg>
          <span>Consultant</span>
          <span class="nav-badge">SOON</span>
        </button>
        <button class="nav-item" data-page="settings" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.82-2.83l.06-.06a1.7 1.7 0 0 0 .33-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 8.9a1.7 1.7 0 0 0-.33-1.88l-.06-.06a2 2 0 1 1 2.82-2.82l.06.06a1.7 1.7 0 0 0 1.87.33h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.33l.06-.06a2 2 0 1 1 2.83 2.82l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
          <span>Settings</span>
        </button>
      </nav>

      <div class="sb-profile" id="mh-profile" title="Research Director">
        <div class="avatar">RD</div>
        <div>
          <div class="mp-name">Research Director</div>
          <div class="mp-role">Full access</div>
        </div>
      </div>
    </aside>

    <!-- ═══════════════ slim topbar ═══════════════ -->
    <header class="masthead">
      <div id="page-title" style="font-size:14px; font-weight:550; letter-spacing:0">Studio</div>

      <div class="mh-actions">
        <div class="mh-search">
          <input id="global-search" type="text" placeholder="Search the department…" aria-label="Global search" />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
          <span class="kbd">⌘K</span>
        </div>

        <button class="icon-btn" id="btn-updates" title="Update available" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          <span class="dot"></span>
        </button>

        <button class="icon-btn tt" data-tip="Notifications" id="btn-bell">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="dot" id="bell-dot" style="display:none"></span>
        </button>

        <button class="icon-btn tt" data-tip="Theme" id="btn-theme">
          <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.3 4.3l1.6 1.6M18.1 18.1l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.3 19.7l1.6-1.6M18.1 5.9l1.6-1.6"/></svg>
          <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.6 8.6 0 1 1 11.2 3 6.9 6.9 0 0 0 21 12.8z"/></svg>
        </button>
      </div>
    </header>

    <!-- ═══════════════ center stage (pages) ═══════════════ -->
    <main class="stage-scroll" id="main">
      <div id="pages"></div>
    </main>
  </div>

  <div class="status-chip">
    <span class="sc-dot"></span>
    <span id="sb-status">All systems operational</span>
    <span>·</span>
    <b id="sb-version">v—</b>
  </div>

  <script src="vendor/chart.umd.js"></script>
  <script src="js/dev-stub.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/updater-ui.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/research.js"></script>
  <script src="js/pages/niches.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/pages/consultant.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

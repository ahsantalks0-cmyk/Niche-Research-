name: Build & Release

# Every push to main → build the Windows installer → publish a GitHub Release
# (with the .exe + latest.yml) so the in-app electron-updater can find it.
#
# ANTI-COLLISION VERSIONING:
#   "Resolve unique release version" checks every existing tag (local +
#   remote via git ls-remote) and, if v{version} is taken, auto-bumps the
#   patch (0.1.0 → 0.1.1 → …) and rewrites package.json BEFORE the build.
#   Every run therefore publishes a brand-new release — never a duplicate.
#
# WHY WE PUBLISH VIA gh (not electron-builder --publish always):
#   electron-builder spawns TWO parallel GitHub publisher instances (one per
#   artifact) which race to create the same release → the loser gets
#   HTTP 422 "Published releases must have a valid tag" and the whole task
#   aborts mid-upload (observed on run #2). Publishing here is single-threaded
#   and idempotent: the release + tag are created first, then assets upload.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout (full history — needed for tag collision detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax lint
        run: npm run lint

      - name: Resolve unique release version (auto-bump past existing tags)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/resolve-version.mjs

      - name: Build & package (electron-builder → NSIS, no network publish)
        run: npx electron-builder --win nsis --publish never

      - name: Publish release (single-threaded, race-free)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "Publishing release $TAG (version: $VERSION)..."

          # Verify distribution assets exist
          ls -la dist/

          # Ensure the release exists and is marked as latest
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists on GitHub — updating notes and marking latest..."
            gh release edit "$TAG" \
              --title "Niche Research Department $TAG" \
              --notes "Automated build from commit ${{ github.sha }}.
          - Windows installer (NSIS, x64)
          - latest.yml included for in-app auto-updates" \
              --latest
          else
            echo "Creating brand-new GitHub Release $TAG..."
            gh release create "$TAG" \
              --title "Niche Research Department $TAG" \
              --notes "Automated build from commit ${{ github.sha }}.
          - Windows installer (NSIS, x64)
          - latest.yml included for in-app auto-updates" \
              --latest
          fi

          # Upload installer + blockmap + updater metadata (using find/glob expansion)
          gh release upload "$TAG" \
            dist/*.exe \
            dist/*.blockmap \
            dist/latest.yml \
            --clobber

          echo "Release $TAG published successfully:"
          gh release view "$TAG"

      - name: Upload installer artifact (always, for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
